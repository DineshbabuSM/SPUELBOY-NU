<!-- The supplied artwork, cropped to its ink and sized for a 2x display.
     Decorative: the hero says everything in words, so it carries an empty alt
     and is hidden from assistive tech rather than described twice.

     Intrinsic width/height are set so the browser reserves the box before the
     file arrives — without them the copy beside it shifts on load. -->
<img
  class="doodle"
  src="doodle-thread.png"
  alt=""
  aria-hidden="true"
  width="1460"
  height="542"
  decoding="async"
/>
